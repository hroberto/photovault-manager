[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/takeout",
    "crates/cas",
    "crates/catalog",
    "crates/exif",
    "crates/google",
    "crates/restore",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
photovault-core = { path = "crates/core" }
photovault-takeout = { path = "crates/takeout" }
photovault-cas = { path = "crates/cas" }
photovault-exif = { path = "crates/exif" }
photovault-google = { path = "crates/google" }
photovault-restore = { path = "crates/restore" }
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
photovault-catalog = { path = "crates/catalog" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"
camino = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
