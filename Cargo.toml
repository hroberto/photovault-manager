[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/takeout",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
photovault-core = { path = "crates/core" }
photovault-takeout = { path = "crates/takeout" }
photovault-cas = { path = "crates/cas" }
photovault-catalog = { path = "crates/catalog" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"
camino = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
